michigan:
  pl: |
    Algorytm oparty o podejście Michigan.

    Osobnik - reprezentacja pojedynczej maszyny z pakietu maszyn. Składa się z 1 chromosomu.
    Chromosom - reprezentacja przypisanego do osobnika (maszyny) zestawu zadań.
    Gen - reprezentacja pojedynczego zadania z pakietu zadań. 

    Selekcja - brak selekcji pomiędzy epokami.
    
    Krzyżowanie - n-punktowe, każdy osobnik bierze udział.
    
    Mutacja - mieszanie (shuffle) genów (zadań) w chromosomie.
  en: |
    Algorithm based on the Michigan approach.
    
    Entity - a representation of a single machine from the machine array. Made up of 1 chromosome.
    Chromosome - a representation of the tasks assigned to the entity (machine).
    Gene - a representation of a single task from the task array.
    
    Selection - no selection between epochs.
    
    Crossover - n-point, every entity takes part.

    Mutation - shuffling of genes (tasks) within a chromosome.
pitt_perm:
  pl: |
    Algorytm oparty o podejście Pitt, reprezentacja permutowana.

    Osobnik - reprezentacja konkretnego harmonogramu zadań dla wszystkich maszyn. Składa się z 2 chromosomów.
    Chromosom 1 - lista zadań w konkretnej kolejności. Składa się z N (liczba zadań) genów.
    Chromosom 2 - liczba zadań z chromosomu 1 przypisanych do maszyn. Składa się z M (liczba maszyn) genów.
    Gen (chromosom 1) - pojedyncze zadanie z listy zadań.
    Gen (chromosom 2) - liczba zadań przypisanych do konkretnej maszyny. Indeks genu w chromosomie definiuje maszynę (machine_id).

    Selekcja - brak selekcji pomiędzy epokami.

    Krzyżowanie - PMX (partial mapped crossover), CX (cycle crossover), OX (ordered crossover). Każdy osobnik bierze udział.

    Mutacja - S (swap mutation - zamiana zadań pomiędzy maszynami) i T (transposition mutation - przeniesienie zadania jednej maszyny do harmonogramu drugiej).
  en: |
    Algorithm based on the Pitt approach, permutated representation.

    Entity - a representation of a particular schedule of tasks for all machines. Made up of 2 chromosomes.
    Chromosome 1 - array of tasks in a specific order. Made up of N (task number) genes.
    Chromosome 2 - number of tasks (taken from chromosome 1) assigned to machines. Made up of M (machine number) genes.
    Gene (chromosome 1) - a single task from the task array.
    Gene (chromosome 2) - number of tasks assigned to a specific machine. The index of the gene in a chromosome defined the machine (machine_id).

    Selection - no selection between epochs.

    Crossover - PMX (partial mapped crossover), CX (cycle crossover), OX (ordered crossover). Every entity takes part.

    Mutation - S (swap mutation - swaps tasks between machines) i T (transposition mutation - moves a task from one machine's schedule to another's).
pitt_direct:
  pl: |
    Algorytm oparty o podejście Pitt, reprezentacja bezpośrednia.
        
    Osobnik - reprezentacja konkretnego harmonogramu zadań dla wszystkich maszyn. Składa się z 1 chromosomu.
    Chromosom - harmonogram zadań dla wszystkich maszyn. Składa się z N (liczba zadań) genów.
    Gen - reprezentacja maszyny (machine_id). Indeks genu w chromosomie to numer zadania przypisanego do maszyny. Geny mogą powtarzać się w chromosomie.
    
    Selekcja - brak selekcji pomiędzy epokami.
    
    Krzyżowanie - n-punktowe, każdy osobnik bierze udział.
    
    Mutacja - losowanie nowej wartości genu (machine_id) wewnątrz chromosomu.
  en: |
    Algorithm based on the Pitt approach, direct representation.
    
    Entity - a representation of a particular schedule of tasks for all machines. Made up of 1 chromosome.
    Chromosome - a particular schedule of tasks for all machines. Made up of N (task number) genes.
    Gene - a representation of a machine (machine_id). The index of a gene in a chromosome is a number of a task that's assigned to this machine. Genes can repeat in the chromosome.
    
    Selection - no selection between epochs.
    
    Crossover - n-point, every entity takes part.
    
    Mutation - a gene's value (machine_id) is replaced with a new, randomly generated one.
fruitfly:
  pl: |
    Algorytm optymalizacyjny Fruitfly. Rodzaj algorytmu optymalizacyjnego particle swarm.
    
    Osobniki i przestrzeń poszukiwań konstruowane są tak samo, jak zostało przedstawione w opisie metody Dragonfly.
    
    Algorytm definiuje 2 fazy:
    1. Szukanie zapachu (smell search), czyli znalezienie pozycji osobnika z najlepszą wartością funkcji przystosowania, 
    2. Przemieszczenie się w stronę zapachu (vision search).
    
    Algorytm wykonuje te 2 fazy w pętli aż do osiągnięcia warunku końcowego.
  en: |
    Fruitfly optimisation algorithm. A type of particle swarm optimisation algorithm.
    
    Entities and the search space are constructed in the same way as is defined in the description of the Dragonfly method.
    
    The algorithm defines 2 phases:
    1. Smell search -  finding the position of the entity with the best value of the fitness function,
    2. Vision search - "flying" toward the position of the smell.
    
    The algorithm performs these 2 phases in a loop until a stop condition is reached.
dragonfly:
  pl: |
    Algorytm optymalizacyjny Dragonfly. Rodzaj algorytmu optymalizacyjnego particle swarm.

    Algorytm polega na zdefiniowaniu w przestrzeni poszukiwań miejsc z jedzeniem (najlepszym rozwiązaniem z poprzedniej epoki) i z wrogami (najgorszym rozwiązaniem z poprzedniej epoki).
    Poziom przyciągania do źródeł jedzenia i odpychania od wrogów jest dyktowany parametrami.

    Osobniki w pobliżu (próg określony parametrem) tworzą sąsiedztwo danego osobnika.

    Dodatkowo zdefiniowane są parametry (wagi) w postaci:
    1. Bezwładności osobników (inertia)
    2. Separacji osobników od siebie (separation),
    3. Poruszania się z podobną prędkością co reszta osobników (alignment),
    4. Poruszania się w stronę centrum swojego sąsiedztwa (cohesion).

    Przestrzeń poszukiwań można sobie wyobrazić jako N-wymiarową (M = liczba zadań) przestrzeń z osobnikami "latającymi" wewnątrz niej zgodnie z ustalonymi parametrami.
    Pozycja (koordynaty) osobników wyrażają harmonogram w postaci [machine_id, machine_id, ...], gdzie indeks to numer zadania wykonywanego przez maszynę.

    Przykładowo, dla 3 zadań osobniki "latają" po 3-wymiarowej przestrzeni, gdzie ich koordynaty to harmonogram wszystkich maszyn.
  en: |
    Dragonfly optimisation algorithm. A type of particle swarm optimisation algorithm.

    Algorithm defines places with food (best solution from last epoch) and enemies (worst solution from last epoch) in the search space.
    Levels of attraction toward food sources and repulsion from enemies are defined with parameters.

    Entities close (threshold is defined with a parameter) to the specific entity are considered its neighbourhood.

    Additionally, the following parameters (weights) are defined:
    1. Inertia of entities,
    2. Separation of entities from each other,
    3. Alignment of the entity in terms of speed with the rest of entities,
    4. Cohesion of entities in terms of being drawn to the center of their neighbourhood.

    The search space can be visualised as a N-dimensional (N = task number) space with the entities "flying" inside of it according to the defined parameters.
    Entity's position (its coordinates) represent a schedule in the form of [machine_id, machine_id, ...], where the index denotes the task number assigned to the machine.

    For example, for 3 machines the entities "fly" through a 3-dimensional space, where each entity's coordinates are a schedule for all the machines.